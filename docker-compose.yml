services:
  neo4j:
    image: neo4j:5.24          # native vector index (no plugin needed)
    container_name: brain_neo4j
    ports: ["7474:7474", "7687:7687"]
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_server_memory_heap_max__size=1G
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama:                       # local, pluggable LLM backend (OpenAI-compatible API)
    image: ollama/ollama:latest
    container_name: brain_ollama
    ports: ["11434:11434"]
    volumes: ["ollama_models:/root/.ollama"]
    # GPU passthrough (needs nvidia-container-toolkit on the host). Comment out for CPU-only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    build: ./api
    container_name: brain_api
    ports: ["8000:8000"]
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:3b-instruct}
      - EMBED_MODEL=${EMBED_MODEL:-pritamdeka/S-PubMedBert-MS-MARCO}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes: ["hf_cache:/app/.hf_cache"]
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started

  streamlit-app:
    build: ./streamlit-app
    container_name: brain_ui
    ports: ["8501:8501"]
    environment: [API_URL=http://api:8000]
    depends_on: [api]

volumes:
  neo4j_data:
  ollama_models:
  hf_cache:
