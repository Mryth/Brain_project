services:
  neo4j:
    image: neo4j:4.4
    container_name: neo4j_db
    # La ligne 'user' a été supprimée, ce n'est plus nécessaire
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      # On utilise des volumes gérés par Docker au lieu de dossiers locaux
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: neo4j/password123

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: fastapi_api
    ports:
      - "8000:8000"
    volumes:
      # On garde ce volume pour pouvoir modifier le code en direct
      - ./api:/app
      # Le cache utilise maintenant un volume géré pour éviter les problèmes de permission
      - huggingface_cache:/home/user/.cache/huggingface
    depends_on:
      - neo4j
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/home/user/.cache/huggingface
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123

  streamlit:
    build:
      context: ./streamlit-app
      dockerfile: Dockerfile
    container_name: streamlit_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit-app:/app
    depends_on:
      - api

# On déclare ici les volumes que Docker doit gérer
volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  huggingface_cache:


